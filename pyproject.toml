[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mindfiddle"
version = "0.1.0"
description = "Interpreter for the mindfiddle tape language"
requires-python = ">=3.10"

[project.scripts]
mindfiddle = "mindfiddle.cli:main"

[tool.setuptools]
packages = ["mindfiddle"]
